name: CI

on:
  pull_request:
    paths-ignore:
      - "Web/**"
      - ".github/workflows/blitzrecorder-web.yml"
  push:
    branches:
      - main
    paths-ignore:
      - "Web/**"
      - ".github/workflows/blitzrecorder-web.yml"
  workflow_dispatch:

env:
  PREFERRED_XCODE_VERSIONS: "26.5 26.0"

jobs:
  test:
    name: Swift Tests And Unsigned Builds
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Preferred Xcode
        run: |
          set -euo pipefail
          for version in $PREFERRED_XCODE_VERSIONS; do
            candidate="/Applications/Xcode_${version}.app"
            if [[ -d "$candidate" ]]; then
              sudo xcode-select -s "$candidate"
              break
            fi
          done
          xcodebuild -version

      - name: Swift Package Tests
        run: |
          set -euo pipefail
          swift test
          DIRECT_DISTRIBUTION=1 swift test --filter 'AppUpdate.*Tests'
          swift test --package-path Packages/BlitzRecorderCore
          swift test --package-path Packages/BlitzRecorderDomain
          swift test --package-path Packages/BlitzRecorderTransport
          swift build --package-path Apps/WindowsStudio

      - name: App Store Connect Local Checks
        run: |
          set -euo pipefail
          Scripts/test-app-store-connect-readiness.py
          Scripts/test-app-store-connect-bootstrap.py
          Scripts/app-store-connect-readiness.py --dry-run

      - name: macOS Unsigned Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project BlitzRecorder.xcodeproj \
            -scheme BlitzRecorder \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/XcodeDerivedData-CI-macOS \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: iOS Simulator Unsigned Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project BlitzRecorder.xcodeproj \
            -scheme BlitzRecorderCamera \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/XcodeDerivedData-CI-iOS \
            CODE_SIGNING_ALLOWED=NO \
            build

  windows-x64:
    name: Windows x64 Compile
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    env:
      ACTIONS_RUNNER_DISABLE_NODE_MAGLEV: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assert Windows tree
        shell: pwsh
        run: .\Scripts\windows\assert-studio-tree.ps1

      - name: Setup Swift
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: "6.3.1"

      - name: Assert Swift on PATH
        shell: pwsh
        run: |
          if (-not (Get-Command swift -ErrorAction SilentlyContinue)) {
            throw "swift missing after setup-swift"
          }
          Write-Host "swift=$((Get-Command swift).Source)"
          if (Get-Command cl -ErrorAction SilentlyContinue) {
            Write-Host "cl=$((Get-Command cl).Source)"
          } else {
            Write-Host "cl missing here; build-studio.ps1 merges vcvars without wiping Swift PATH"
          }

      - name: Domain Tests
        run: swift test --package-path Packages/BlitzRecorderDomain

      - name: Build Windows Studio
        shell: pwsh
        run: .\Scripts\windows\build-studio.ps1 -Configuration release

      - name: Stage exe and Swift runtime
        shell: pwsh
        run: |
          .\Scripts\windows\stage-studio.ps1 `
            -PackageRoot Apps\WindowsStudio `
            -StageDir build\windows-stage `
            -ZipPath build\windows-portable\BlitzRecorder-Windows-ci.zip

      - name: Assert staged exe launches
        shell: pwsh
        run: .\Scripts\windows\assert-studio-launches.ps1 -StageDir build\windows-stage

      - name: Capture Windows Store screenshot
        shell: powershell
        continue-on-error: true
        run: .\Scripts\windows\capture-studio-screenshot.ps1

      - name: Upload Windows Store screenshot
        uses: actions/upload-artifact@v7
        with:
          name: windows-store-screenshot
          path: build/windows-store/Studio-Screenshot.png
          if-no-files-found: warn

      - name: Package Microsoft Store MSIX
        shell: pwsh
        run: .\Scripts\windows\package-store-msix.ps1

      - name: Upload Microsoft Store MSIX
        uses: actions/upload-artifact@v7
        with:
          name: windows-store-msix-x64
          path: build/windows-store/BlitzRecorder-Windows-Store-x64.msix
          if-no-files-found: error

      - name: Upload portable zip
        uses: actions/upload-artifact@v7
        with:
          name: windows-studio-portable
          path: build/windows-stage
          if-no-files-found: error

      - name: Upload staged studio
        uses: actions/upload-artifact@v7
        with:
          name: windows-studio-x64
          path: build/windows-stage/**
          if-no-files-found: error

      - name: Compile installer script
        shell: pwsh
        run: |
          .\Scripts\windows\compile-installer.ps1 `
            -OutputName BlitzRecorder-Windows-ci-check `
            -OutputDir build\windows-iss-check `
            -AppVersion 0.0.0-ci

      - name: Assert installed app launches
        shell: pwsh
        run: .\Scripts\windows\assert-installer-launches.ps1 -InstallerPath build\windows-iss-check\BlitzRecorder-Windows-ci-check.exe

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-studio-installer-unsigned
          path: build/windows-iss-check/BlitzRecorder-Windows-ci-check.exe
          if-no-files-found: error

  windows-fixture:
    name: Windows H.264 Fixture
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assert Windows tree
        shell: pwsh
        run: .\Scripts\windows\assert-studio-tree.ps1 -NativeOnly

      - name: Assert inbox H.264
        shell: pwsh
        run: .\Scripts\windows\assert-media-foundation.ps1

      - name: Build native capture and fixture
        shell: pwsh
        run: .\Scripts\windows\build-studio.ps1 -Configuration release -NativeOnly

      - name: Export And Play Fixture
        shell: pwsh
        run: .\Scripts\windows\export-fixture.ps1 -PackageRoot Apps\WindowsStudio

      - name: Upload fixture
        uses: actions/upload-artifact@v7
        with:
          name: windows-h264-fixture
          path: build/windows-fixture/**
          if-no-files-found: error
